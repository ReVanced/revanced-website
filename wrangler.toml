name = "revanced-website"
compatibility_date = "2026-03-14"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_flags = ["nodejs_compat"]

# Server-side persistence for the fallback URL from the /about endpoint.
# Required so the "recover: false" capture mechanism also applies at the SSR layer, without it capture is browser-only.
# sveltekit does not yet support Durable Objects, so KV is the persistence layer instead of deploying a separate worker.
# The Storage interface in src/lib/api/storage.ts keeps the implementation swappable once DO is supported.
# The namespace id is injected by CI at deploy time from the KV_NAMESPACE_ID repository secret, probably worth looking at .github/workflows/deploy.yml.
[[kv_namespaces]]
binding = "STORAGE"
id = "__KV_NAMESPACE_ID__"
